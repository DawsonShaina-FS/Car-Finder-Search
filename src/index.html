<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New ES6/SCSS Project</title>
</head>

<body>
  <main class="car-finder">
    <div class="car-finder__content">
      <h1>Used Car Finder</h1>

      <p>Find a used car based on its year, make, and model.</p>

      <div class="car-finder__form">

        <div class="form-group">
          <label for="year">Year</label>
          <select id="year">
            <option value="">Select Year</option>
          </select>
        </div>

        <div class="form-group">
          <label for="make">Make</label>
          <select id="make" disabled>
            <option value="">Select Make</option>
          </select>
        </div>

        <div class="form-group">
          <label for="model">Model</label>
          <select id="model" disabled>
            <option value="">Select Model</option>
          </select>
        </div>

      </div>
    </div>
  </main>
  <script src="bundle.js"></script>
</body>

</html>
